name: Build and Push Inference Container

on:
  workflow_dispatch: # Manual trigger for now
  # push:
  #   branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: "visioncctv" # REPLACE THIS with your ACR name

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure Login (Passwordless OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure ML CLI v2
        run: az extension add -n ml -y

      - name: Download Production Model from Azure ML
        run: |
          # Download the latest model from the workspace directly into the backend folder
          az ml model download \
            --name "yolov8s-world-secure" \
            --version 1 \
            --download-path ./backend \
            --resource-group "${{ vars.AZURE_RG }}" \
            --workspace-name "${{ vars.AZURE_WORKSPACE }}"
            
          # The CLI puts it in a subfolder, so we move it to the root of the backend folder
          mv ./backend/yolov8s-world-secure/yolov8s-world.safetensors ./backend/yolov8s-world.safetensors

      - name: Login to Azure Container Registry
        run: |
          # Uses the exact same OIDC credential to log into the container registry!
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Images
        run: |
          FRONTEND_IMAGE="${{ env.ACR_NAME }}.azurecr.io/vision-frontend:${{ github.sha }}"
          FRONTEND_LATEST="${{ env.ACR_NAME }}.azurecr.io/vision-frontend:latest"
          
          BACKEND_IMAGE="${{ env.ACR_NAME }}.azurecr.io/vision-backend:${{ github.sha }}"
          BACKEND_LATEST="${{ env.ACR_NAME }}.azurecr.io/vision-backend:latest"
          
          # Build Frontend
          docker build -t $FRONTEND_IMAGE -t $FRONTEND_LATEST .
          
          # Build Backend (expects safetensors file to be present)
          docker build -t $BACKEND_IMAGE -t $BACKEND_LATEST ./backend
          
          # Push Frontend
          docker push $FRONTEND_IMAGE
          docker push $FRONTEND_LATEST
          
          # Push Backend
          docker push $BACKEND_IMAGE
          docker push $BACKEND_LATEST
