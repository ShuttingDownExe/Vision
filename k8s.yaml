apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-backend
  labels:
    app: vision-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vision-backend
  template:
    metadata:
      labels:
        app: vision-backend
    spec:
      containers:
      - name: backend
        image: vision-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: vision-backend-svc
spec:
  type: NodePort
  selector:
    app: vision-backend
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-frontend
  labels:
    app: vision-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vision-frontend
  template:
    metadata:
      labels:
        app: vision-frontend
    spec:
      containers:
      - name: frontend
        image: vision-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: vision-frontend-svc
spec:
  type: NodePort
  selector:
    app: vision-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
